# Everything dataset-specific lives here.

task: regression      # auto | classification | regression

data:
  path: data/raw/auto-mpg.data
  read_options:                # whitespace-delimited, no header, "?" = missing
    sep: '\s+'
    header: null
    names: [mpg, cylinders, displacement, horsepower, weight, acceleration, model_year, origin, car_name]
    na_values: ["?"]
  target: mpg
  drop_columns: [car_name]       # unique per row (identifier)
  categorical_columns: [origin]  # region codes, not quantities
  processed_dir: data/processed  # raw files are never modified
  val_size: 0.15
  test_size: 0.15                # train gets the remaining 70%
  random_state: 42
  stratify: true                 # classification only
  max_categorical_cardinality: 50  # drop categoricals with more unique values
  sample_rows: null              # subsample large datasets for quick runs

model:
  # classification: logistic_regression | random_forest | gradient_boosting
  # regression:     linear_regression | ridge | random_forest | gradient_boosting
  name: random_forest
  params: {}                   # passed to the scikit-learn estimator

output_dir: models             # git-ignored
reports_dir: reports
update_readme: true            # rewrite the README RESULTS block after training
